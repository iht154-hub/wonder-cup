<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>제1회 FC원더티처배 축구대회 운영</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style id="appstyle">
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#0F1728; --muted:#667085; --line:#E3E7EE;
  --navy:#0E1A33; --navy2:#17284A; --navyline:rgba(255,255,255,.1);
  --accent:#F26B21; --accentink:#C2510F; --accentbg:#FFF1E8;
  --ok:#12A46A; --okbg:#E8F7EF; --red:#E0464B; --redbg:#FDEDEE; --warnbg:#FFF6EE;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --pitch:var(--navy); --pitch2:var(--navy2); --whistle:var(--accent); --chalk:#fff;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A111F; --surface:#111A2C; --surface2:#16213A; --ink:#E7EBF3; --muted:#8C97AB; --line:#223150;
    --navy:#070D19; --navy2:#13213D; --accentink:#FF9A5C; --accentbg:#2B1C12;
    --ok:#3CCB8A; --okbg:#10291F; --red:#FF6B6F; --redbg:#331618; --warnbg:#261C14;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#111A2C; --surface2:#16213A; --ink:#E7EBF3; --muted:#8C97AB; --line:#223150;
  --navy:#070D19; --navy2:#13213D; --accentink:#FF9A5C; --accentbg:#2B1C12;
  --ok:#3CCB8A; --okbg:#10291F; --red:#FF6B6F; --redbg:#331618; --warnbg:#261C14;
  --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.disp{font-weight:800;letter-spacing:-0.025em}
.mono,.clock,.slot .tm,.stat .n,.pk .no,.pk .birth{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"zero" 0;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}

/* top bar */
.topbar{background:var(--navy);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 14px}
.top h1{margin:0;font-size:19px;line-height:1.25;color:#fff;word-break:keep-all}
.top h1::before{content:"";display:inline-block;width:4px;height:16px;background:var(--accent);border-radius:2px;margin-right:9px;vertical-align:-1px}
.top .sub{color:rgba(255,255,255,.6);font-size:13px;margin-top:2px}
.top .grow{flex:1;min-width:0}
.status{font-size:12px;color:rgba(255,255,255,.55);white-space:nowrap}
.pill{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.12)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;max-width:960px;margin:0 auto}
.nav button{flex:1;border:0;background:none;padding:13px 1px 14px;font-size:13px;white-space:nowrap;font-weight:600;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
main{padding-bottom:100px}
@media (min-width:860px){
  .nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:0;background:var(--navy);box-shadow:0 1px 0 var(--navyline)}
  .nav .in{padding:0 18px}
  .nav button{flex:none;padding:12px 16px 14px;font-size:14px;color:rgba(255,255,255,.6)}
  .nav button:hover{color:#fff}
  .nav button[aria-current="page"]{color:#fff}
  .nav button[aria-current="page"]::before{top:auto;bottom:0;left:16px;right:16px;border-radius:3px 3px 0 0}
  main{padding-bottom:56px}
}

/* scoreboard */
.board{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:18px;padding:22px 22px 20px;margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:10px 26px;align-items:end;box-shadow:0 8px 24px rgba(14,26,51,.18)}
.board::before{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-70px;top:50%;transform:translateY(-50%)}
.board::after{content:"";position:absolute;top:0;bottom:0;right:50px;width:1px;background:rgba(255,255,255,.08)}
.board>*{position:relative;z-index:1}
.clock{font-size:58px;line-height:.95;font-weight:700;grid-row:span 2;letter-spacing:-0.02em}
.board .k{display:inline-block;color:#fff;background:var(--accent);font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;margin-right:8px;vertical-align:2px;letter-spacing:.02em}
.board .k.dim{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)}
.board strong{font-size:18px;font-weight:700}
.board small{display:block;color:rgba(255,255,255,.62);font-size:13px;margin-top:3px}
@media (max-width:520px){.board{grid-template-columns:1fr}.clock{grid-row:auto;font-size:48px;margin-bottom:4px}}

/* sections */
.sec{margin-top:30px}
.sec>header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:17px;display:flex;align-items:center}
.sec h2::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px;margin-right:9px}
.sec>header .grow{flex:1}
.sec>header .meta{color:var(--muted);font-size:13px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600}
.row .t2{color:var(--muted);font-size:13px}

.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy2)}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--accent)}}
@media (max-width:420px){.nav button{font-size:12px}}
@media (max-width:520px){.top h1{font-size:16px}.top .pill{padding:5px 10px;font-size:12px}}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.lnk{border:0;background:none;padding:4px 6px;color:var(--accentink);font-size:13px;font-weight:600}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.call{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;background:var(--surface)}
.call:hover{border-color:var(--accent);color:var(--accentink)}

.role{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--accent);border-color:var(--accent)}}
.chip.rc.on{background:var(--c);border-color:var(--c);color:#fff}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.asg-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.asg-h .mono{font-size:13px;color:var(--muted)}
.mainrole{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);font-weight:600}
.mainrole::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mainrole b{color:var(--ink);font-size:13px}
.mainrole.big{display:block;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);border-left:4px solid var(--c);font-size:13px}
.mainrole.big::before{display:none}
.mainrole.big b{font-size:16px;margin-left:4px}
.mainpick{padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.chip.ismain:not(.on){border-color:var(--c);border-width:2px}
.rboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 19px;box-shadow:var(--shadow);position:relative}
.rcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.rc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.rc-h .role{font-size:15px;font-weight:700}
.rc-h .role::before{width:9px;height:9px}
.rc-n{font-size:13px;color:var(--muted);font-weight:600}
.pchip{padding:5px 11px}
button.pchip:hover{border-color:var(--c);color:var(--ink)}
.subh{font-style:italic;color:var(--muted)}
.asg-o{font-weight:500;opacity:.75;margin-left:2px}
.arow.asg-on{background:var(--accentbg);margin:0 -20px;padding:10px 20px}

.ck{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck[disabled]{cursor:default}
.done .t1{text-decoration:line-through;color:var(--muted)}

/* timeline */
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:15px 18px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .tm b{display:block;font-size:16px;font-weight:600}
.slot .tm span{color:var(--muted);font-size:12px}
.slot h3{margin:0;font-size:15px;font-weight:700}
.slot .pl{color:var(--muted);font-size:13px}
.slot.now{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
.slot.past{opacity:.5}
.as{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:7px}
.as .who{font-size:14px}
.miss{color:var(--red);font-style:normal;font-weight:600;font-size:13px}
.vs{font-weight:700;font-size:15px;color:var(--ink)}
.slot .vs{margin-top:2px}
span.vs{font-size:inherit;color:var(--accentink)}
.allbadge{display:inline-block;margin-top:6px;background:var(--accentbg);color:var(--accentink);font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.allbadge.play{background:var(--navy);color:#fff}
.note{margin-top:6px;font-size:13px;color:var(--muted);white-space:pre-wrap}
.me-hl{background:var(--accentbg);color:var(--accentink);border-radius:5px;padding:0 5px;font-weight:700}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{border-radius:12px;padding:12px 16px;font-size:14px;background:var(--warnbg);border:1px solid transparent}
.alert.red{background:var(--redbg)}
.alert b{display:block;margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .n{font-size:22px;line-height:1.2;font-weight:600}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

.notice{padding:14px 18px;border-top:1px solid var(--line)}
.notice:first-child{border-top:0}
.notice.pin{background:var(--accentbg)}
.notice p{margin:0;white-space:pre-wrap}
.notice .when{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:10px;align-items:center}

/* map */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;box-shadow:var(--shadow)}
svg.map{display:block;width:100%;min-width:480px;height:auto;user-select:none;-webkit-user-select:none}
svg.map .gbg{fill:var(--surface2)}
svg.map .gdot{fill:var(--line)}
svg.map text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-weight:700;font-size:7px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
svg.map .zone.drag{cursor:grab;touch-action:none}
svg.map .zone.drag:active{cursor:grabbing}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.bin{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;padding-left:22px}
.bin::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.bin h3{margin:0 0 2px;font-size:16px}
.bin p{margin:2px 0 0;font-size:14px}
.bin .tip{color:var(--muted);font-size:13px}

.sos{display:flex;align-items:center;gap:16px;background:var(--red);color:#fff;border-radius:14px;padding:15px 18px;text-decoration:none;box-shadow:0 6px 18px rgba(224,70,75,.25)}
.sos .disp{font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.plan h3{margin:0 0 6px;font-size:15px}
.plan p{margin:0;white-space:pre-wrap;font-size:14px;color:var(--muted)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

textarea.compose{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:11px 13px;resize:vertical;min-height:72px}
.cmp{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mepick select{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:9px 12px;font-weight:600;min-width:160px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,13,25,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 14px;font-size:18px}
.fl{display:block;margin-bottom:12px}
.fl>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fl input,.fl select,.fl textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px 12px}
.fl input:focus,.fl select:focus,.fl textarea:focus,.search:focus,textarea.compose:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.fl input[type=color]{height:42px;padding:3px}
.fl .help{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.fc{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600}
.fc input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.arow{border-top:1px solid var(--line);padding:10px 0}
.arow .need{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.arow .need input{width:17px;height:17px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:18px;align-items:center}
.acts .grow{flex:1}
.err{border-color:var(--red)!important}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}
.hide{display:none!important}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--navy)}
.lg-card{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lg-k{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.16em}
.lg-card h1{margin:8px 0 6px;font-size:24px;line-height:1.3}
.lg-card form{display:flex;gap:8px;margin-top:14px}
.lg-card input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:12px 14px;font-size:17px;letter-spacing:.2em}
.lg-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.lg-err{color:var(--red);font-weight:600;margin:12px 0 0}

/* player check */
.search{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.pk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:11px 18px;color:var(--ink)}
.pk:first-child{border-top:0}
.pk:hover{background:var(--surface2)}
.pk .no{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
.pk.on .no{background:var(--ok);border-color:var(--ok);color:#fff}
.pk .nm{flex:1;font-weight:600;font-size:15px}
.pk .birth{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.pk .st{font-size:13px;font-weight:700;color:var(--muted)}
.pk.on .st{color:var(--ok)}
.pk[disabled]{cursor:default}
.pk[disabled]:hover{background:transparent}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:2px}

    mine.forEach(function(sl){ var rs=myRolesIn(sl,st.id); if(rs.length>1) dbl.push(st.name+': '+sl.title+'에서 '+rs.map(function(r){return r.name;}).join(', ')+' 동시 배정'); });
    for(var i=1;i<mine.length;i++){ if(toMin(mine[i].start)<toMin(mine[i-1].end)) dbl.push(st.name+': '+mine[i-1].title+'와 '+mine[i].title+' 시간이 겹침'); }
    mine.forEach(function(sl){ var c=playClash(st,sl); if(c) dbl.push(st.name+': '+sl.title+' 배정이 본인 출전 경기('+c.start+' '+vsText(c)+')와 겹침'); });
  });
  return {miss:miss,dbl:dbl};
}

function boardHTML(){

    var days=Math.round((new Date(S.meta.date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
    h+='<div class="clock disp">D-'+days+'</div>';
    h+='<div><span class="k">대회 날</span><strong>'+esc(S.meta.date.replace(/-/g,'. '))+'</strong><small>'+esc(S.meta.venue||'')+'</small></div>';
    h+= list[0]?'<div><span class="k dim">첫 일정</span><strong>'+esc(list[0].start+' '+list[0].title)+'</strong><small>'+esc(list[0].place||'')+'</small></div>':'<div></div>';
  } else if(ds==='after'){
    h+='<div class="clock disp">'+clock+'</div><div><strong>대회가 끝났어요</strong><small>대여 물품 반납과 부상 기록을 마지막으로 확인해 주세요.</small></div><div></div>';
  } else {
    var cn=curNext(list), n=nowMin();
    var curs=list.filter(function(x){return slotState(x)==='now';}), nxts=cn.nxt?list.filter(function(x){return x.start===cn.nxt.start;}):[];
    function nm(arr){ return arr.map(function(x){ var v=vsText(x); return x.title+(v?' '+v:'')+(x.place?' ('+x.place+')':''); }).join(', '); }
    h+='<div class="clock disp">'+clock+'</div>';

               : '<div><span class="k">지금</span><strong>'+(cn.nxt?'대기 중':'오늘 일정 끝')+'</strong><small>'+(S.meta.date?'':'설정에서 대회 날짜를 넣으면 날짜까지 맞춰 보여줘요')+'</small></div>';
    h+= cn.nxt ? '<div><span class="k dim">다음</span><strong>'+esc(nm(nxts))+'</strong><small>'+cn.nxt.start+' 시작, '+dur(toMin(cn.nxt.start)-n)+' 후</small></div>' : '<div></div>';

  return '<section class="board" id="board" aria-live="polite">'+h+'</section>';
}

function myTaskBlock(label, sl, me){
  var rs = myRolesIn(sl, me.id);
  var what = sl.all ? '스태프 전원 작업' : (plays(sl,playTeam(me)) && !rs.length ? '선수로 출전' : rs.map(function(r){return r.name;}).join(', '));

  return '<div style="margin-bottom:10px"><div class="small muted">'+label+' ('+esc(sl.start+'–'+sl.end)+')</div><div style="font-size:18px;font-weight:700">'+esc(sl.title)+(vsText(sl)?' <span class="vs">'+esc(vsText(sl))+'</span>':'')+' <span class="small" style="font-weight:600">'+esc(what)+'</span></div><div class="small">'+esc(sl.place||'')+'</div>'+(sl.note?'<div class="note">'+esc(sl.note)+'</div>':'')+(desc&&!sl.all?'<div class="note">'+esc(desc)+'</div>':'')+'</div>';

function zoneInner(z,w,h,edit){
  var t=ZT[z.type]||ZT.etc, g='';

    var ins=3, cr=Math.min(w,h)*0.13, horiz=w>=h;

    if(horiz){ g+='<line x1="'+w/2+'" y1="'+ins+'" x2="'+w/2+'" y2="'+(h-ins)+'"/>'; var bh=h*0.44,bw=w*0.14; g+='<rect x="'+ins+'" y="'+(h-bh)/2+'" width="'+bw+'" height="'+bh+'"/><rect x="'+(w-ins-bw)+'" y="'+(h-bh)/2+'" width="'+bw+'" height="'+bh+'"/>'; }
    else { g+='<line x1="'+ins+'" y1="'+h/2+'" x2="'+(w-ins)+'" y2="'+h/2+'"/>'; var bw2=w*0.48,bh2=h*0.13; g+='<rect x="'+(w-bw2)/2+'" y="'+ins+'" width="'+bw2+'" height="'+bh2+'"/><rect x="'+(w-bw2)/2+'" y="'+(h-ins-bh2)+'" width="'+bw2+'" height="'+bh2+'"/>'; }
    g+='<circle cx="'+w/2+'" cy="'+h/2+'" r="'+cr+'"/></g>';
    g+='<text x="'+w/2+'" y="'+(h/2)+'" style="fill:#fff;font-size:9px;paint-order:stroke;stroke:'+t.fill+';stroke-width:4px">'+esc(z.label)+'</text>';
  } else {
    g+='<rect width="'+w+'" height="'+h+'" rx="3" style="fill:'+t.fill+';stroke:'+t.stroke+';stroke-width:1.2'+(edit?';stroke-dasharray:3 2':'')+'"/>';
    g+='<text x="'+w/2+'" y="'+h/2+'" style="fill:'+t.ink+'">'+esc(z.label)+'</text>';
  }
  if(edit){ g+='<circle class="rh" cx="'+w+'" cy="'+h+'" r="9" style="fill:transparent"/><rect class="rh" x="'+(w-6)+'" y="'+(h-6)+'" width="9" height="9" rx="2" style="fill:#F26B21;stroke:#fff;stroke-width:1"/>'; }

function mapSVG(){
  var I=S.info, W=I.mapW*10, H=I.mapH*10, a=mapEditing();
  var g='<svg class="map" id="mapsvg" viewBox="-6 -6 '+(W+12)+' '+(H+12)+'" role="img" aria-label="구장 배치도"><rect class="gbg" x="0" y="0" width="'+W+'" height="'+H+'" rx="6"/>';
  if(a){ for(var x=1;x<I.mapW;x++) for(var y=1;y<I.mapH;y++) g+='<circle class="gdot" cx="'+x*10+'" cy="'+y*10+'" r=".7"/>'; }
  I.zones.forEach(function(z){
    g+='<g class="zone'+(a?' drag':'')+'" data-zone="'+esc(z.id)+'" transform="translate('+z.x*10+','+z.y*10+')">'+zoneInner(z,z.w,z.h,a)+'</g>';

function freeSpot(w,h){
  var I=S.info;
  function hit(x,y){ return I.zones.some(function(z){ return x<z.x+z.w && x+w>z.x && y<z.y+z.h && y+h>z.y; }); }
  for(var y=0;y<=I.mapH-h;y++) for(var x=0;x<=I.mapW-w;x++) if(!hit(x,y)) return {x:x,y:y};
  return {x:0,y:0};
}
function quickZone(type){

/* map drag */
var drag=null;
document.addEventListener('pointerdown',function(e){
  if(!mapEditing()) return;
  var g=e.target.closest && e.target.closest('.zone.drag'); if(!g) return;
  var svg=document.getElementById('mapsvg'); var z=find(S.info.zones,g.getAttribute('data-zone')); if(!z||!svg) return;
  var rect=svg.getBoundingClientRect();
  var resize=!!e.target.closest('.rh');
  drag={g:g,z:z,resize:resize,sx:e.clientX,sy:e.clientY,ox:z.x,oy:z.y,ow:z.w,oh:z.h,scale:((S.info.mapW*10)+12)/rect.width,moved:false,nx:z.x,ny:z.y,nw:z.w,nh:z.h};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
document.addEventListener('pointermove',function(e){
  if(!drag) return;
  var dx=Math.round((e.clientX-drag.sx)*drag.scale/10), dy=Math.round((e.clientY-drag.sy)*drag.scale/10), I=S.info, z=drag.z;
  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6) drag.moved=true;
  if(drag.resize){
    var nw=Math.max(1,Math.min(I.mapW-z.x,drag.ow+dx)), nh=Math.max(1,Math.min(I.mapH-z.y,drag.oh+dy));
    if(nw!==drag.nw||nh!==drag.nh){ drag.nw=nw; drag.nh=nh; drag.g.innerHTML=zoneInner(z,nw,nh,true); }
  } else {
    var nx=Math.max(0,Math.min(I.mapW-z.w,drag.ox+dx)), ny=Math.max(0,Math.min(I.mapH-z.h,drag.oy+dy));
    if(nx!==drag.nx||ny!==drag.ny){ drag.nx=nx; drag.ny=ny; drag.g.setAttribute('transform','translate('+nx*10+','+ny*10+')'); }
  }
});
function endDrag(cancel){
  if(!drag) return; var d=drag; drag=null;
  if(cancel){ render(); return; }
  if(d.resize){ if(d.nw!==d.ow||d.nh!==d.oh){ d.z.w=d.nw; d.z.h=d.nh; save(); } return; }
  if(d.moved){ if(d.nx!==d.ox||d.ny!==d.oy){ d.z.x=d.nx; d.z.y=d.ny; save(); } }
  else editItem('zone', d.z.id);
}
document.addEventListener('pointerup',function(){ endDrag(false); });
document.addEventListener('pointercancel',function(){ endDrag(true); });
